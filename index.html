/* ===================== TRÒ CHƠI ===================== */
let GL=1;
const TMARK={"́":"sắc","̀":"huyền","̉":"hỏi","̃":"ngã","̣":"nặng"};
const TONE_BTN=[["ngang","a"],["sắc","á"],["huyền","à"],["hỏi","ả"],["ngã","ã"],["nặng","ạ"]];
function toneOf(syl){const d=syl.normalize("NFD");for(const m in TMARK)if(d.includes(m))return TMARK[m];return "ngang";}
const stripTone=s=>s.normalize("NFD").replace(/[̣̀́̃̉]/g,"").normalize("NFC");
const alive=id=>view.name==="game"&&view.g===id;

/* số → chữ tiếng Việt (giá tiền) */
const DG=["không","một","hai","ba","bốn","năm","sáu","bảy","tám","chín"];
function n999(n,full){const h=Math.floor(n/100),te=Math.floor(n/10)%10,u=n%10;const out=[];
  if(h||full)out.push(DG[h]+" trăm");
  if(te===0){if(u&&(h||full))out.push("linh "+DG[u]);else if(u)out.push(DG[u]);}
  else if(te===1){out.push("mười"+(u===0?"":u===5?" lăm":" "+DG[u]));}
  else{out.push(DG[te]+" mươi"+(u===0?"":u===1?" mốt":u===4?" tư":u===5?" lăm":" "+DG[u]));}
  return out.join(" ");}
function viNum(n){if(n===0)return "không";const tr=Math.floor(n/1e6),ng=Math.floor(n/1e3)%1000,r=n%1000;const p=[];
  if(tr)p.push(n999(tr)+" triệu");if(ng)p.push(n999(ng,!!tr)+" nghìn");if(r)p.push(n999(r,!!(tr||ng)));return p.join(" ");}
const vnd=n=>n.toLocaleString("vi-VN")+"đ";

/* ---------- 1. Bắt dấu thanh ---------- */
function toneGame(area,end){
  const pool=[];VOCAB.forEach(v=>v.w.forEach(w=>{const vi=w[0].split(" / ")[0];if(!/^[a-zà-ỹđ ]+$/i.test(vi))return;const sy=vi.split(" ");if(sy.length>3)return;sy.forEach((s,k)=>{if(s.length>1||/[aeiouyăâêôơư]/i.test(s))pool.push({w:vi,k,s,m:w});});}));
  const timeL=[0,0,12,8][GL];let score=0,lives=3,timer=null,cur=null,left=0;
  const next=()=>{if(!alive("tone"))return;clearInterval(timer);cur=rnd(pool);const ans=toneOf(cur.s);
    const choices=GL===1?shuffle([ans,...shuffle(TONE_BTN.map(x=>x[0]).filter(x=>x!==ans)).slice(0,2)]):TONE_BTN.map(x=>x[0]);
    const shown=cur.w.split(" ").map((s,k)=>k===cur.k?`<mark>${esc(stripTone(s))}</mark>`:esc(s)).join(" ");
    area.innerHTML=`<div class="ghud"><span>✓ ${score}</span><span>${"❤️".repeat(lives)}${"🤍".repeat(3-lives)}</span>${timeL?`<span id="tl">⏱ ${timeL}</span>`:""}</div>
     <div class="tg-card"><p class="note">${t("pick_tone")}</p><p class="vi tg-word">${shown}</p>${GL<3?`<p class="tr">${esc(tr3(cur.m))}</p>`:""}
      <div class="bar center"><button class="spk big" id="tgp">${ICON_SPK}</button></div></div>
     <div class="tg-btns">${choices.map(c=>{const b=TONE_BTN.find(x=>x[0]===c);return `<button class="tgb" data-c="${c}"><b class="vi">${b[1]}</b><small class="vi">${c}</small></button>`;}).join("")}</div><div id="tgfb"></div>`;
    const pl=()=>speak(cur.w);$("#tgp").onclick=pl;if(GL>1)setTimeout(pl,200);
    if(timeL){left=timeL;timer=setInterval(()=>{if(!alive("tone"))return clearInterval(timer);left--;const e=$("#tl");if(e)e.textContent="⏱ "+left;if(left<=0){clearInterval(timer);answer(null);}},1000);}
    $$(".tgb").forEach(b=>b.onclick=()=>answer(b.dataset.c));};
  const answer=c=>{clearInterval(timer);const ans=toneOf(cur.s);const ok=c===ans;$$(".tgb").forEach(b=>{b.disabled=true;if(b.dataset.c===ans)b.classList.add("right");else if(b.dataset.c===c)b.classList.add("wrong");});
    sfx(ok?"ok":"no");speak(cur.w);if(ok)score++;else lives--;
    $("#tgfb").innerHTML=`<p class="center vi big2">${esc(cur.w)} · <small class="tr">${esc(tr3(cur.m))}</small></p>`;
    setTimeout(()=>{if(!alive("tone"))return;if(lives<=0)end(score,{win:score>=10,msg:tx(`성조 ${score}개를 맞혔어요!`,`You caught ${score} tones!`)});else next();},ok?900:1600);};
  next();return ()=>clearInterval(timer);}

/* ---------- 2. Quán phở của Bao ---------- */
function phoGame(area,end){
  const MENU=[["phở bò","🍜","tô",60000],["phở gà","🍲","tô",55000],["bánh mì","🥖","ổ",25000],["gỏi cuốn","🥗","phần",40000],["cà phê sữa đá","☕","ly",30000],["trà đá","🧊","ly",5000],["nước dừa","🥥","trái",30000]];
  const NUM=["","một","hai","ba"],WHO=["🧑","👩","👨‍💼","👵","🧑‍🎓","👮","👷","🧔"];
  let served=0,left=[0,150,110,90][GL],order=null,tray={},tick=null;
  const mk=()=>{const n=GL===1?1:GL===2?1+Math.floor(Math.random()*2):1+Math.floor(Math.random()*3);const items=shuffle(MENU).slice(0,n).map(it=>[it,1+Math.floor(Math.random()*(GL===1?2:3))]);
    const parts=items.map(([it,q])=>`${NUM[q]} ${it[2]} ${it[0]}`);const txt="Cho tôi "+(parts.length>1?parts.slice(0,-1).join(", ")+" và "+parts[parts.length-1]:parts[0])+".";
    const ko=items.map(([it,q])=>`${it[1]} × ${q}`).join(", ");return {items,txt,ko,who:rnd(WHO)};};
  const draw=()=>{area.innerHTML=`<div class="ghud"><span>${t("cust")}: ${served}</span><span id="pt">⏱ ${left}${t("sec")}</span></div>
    <div class="stall"><div class="awning"></div><div class="cust"><span class="who">${order.who}</span><div class="bubble2"><p class="vi ${GL===3?"blur":""}">${esc(order.txt)}</p>${GL===1?`<small class="tr">${esc(order.ko)}</small>`:""}<button class="spk" id="psay">${ICON_SPK}</button></div></div></div>
    <div class="menu">${MENU.map((it,i)=>`<div class="mi ${tray[i]?"on":""}"><span class="mi-e">${it[1]}</span><b class="vi">${it[0]}</b><small>${vnd(it[3])}/${it[2]}</small><div class="qty"><button data-m="${i}" aria-label="−">−</button><span>${tray[i]||0}</span><button data-p="${i}" aria-label="+">+</button></div></div>`).join("")}</div>
    <div class="bar center"><button class="btn primary big" id="pserve">🍽️ ${t("serve")}</button></div><div id="pfb"></div>`;
    $("#psay").onclick=()=>speak(order.txt);
    $$("[data-p]").forEach(b=>b.onclick=()=>{const i=+b.dataset.p;tray[i]=Math.min(5,(tray[i]||0)+1);sfx("tap");draw();});
    $$("[data-m]").forEach(b=>b.onclick=()=>{const i=+b.dataset.m;tray[i]=Math.max(0,(tray[i]||0)-1);sfx("tap");draw();});
    $("#pserve").onclick=serve;};
  const nextC=()=>{order=mk();tray={};draw();setTimeout(()=>speak(order.txt),250);};
  const serve=()=>{const ok=order.items.every(([it,q])=>tray[MENU.indexOf(it)]===q)&&Object.values(tray).filter(Boolean).length===order.items.length;
    if(!ok){sfx("no");$("#pfb").innerHTML=`<p class="fb no">${bao("think",40)} <span>${tx("다시 들어 보세요!","Listen again!")} ${GL===1?esc(order.ko):""}</span></p>`;speak(order.txt);return;}
    sfx("ok");served++;$("#pfb").innerHTML=`<p class="fb ok">${bao("happy",40)} <span class="vi">Cảm ơn! Ngon quá!</span></p>`;setTimeout(()=>{if(alive("pho")&&left>0)nextC();},800);};
  tick=setInterval(()=>{if(!alive("pho"))return clearInterval(tick);left--;const e=$("#pt");if(e)e.textContent="⏱ "+left+t("sec");if(left<=0){clearInterval(tick);end(served,{win:served>=[0,4,5,6][GL],msg:tx(`손님 ${served}명에게 쌀국수를 팔았어요!`,`You served ${served} customers!`)});}},1000);
  nextC();return ()=>clearInterval(tick);}

/* ---------- 3. Mặc cả ở chợ (số đếm) ---------- */
function choGame(area,end){
  const ITEMS2=["👕","👒","👜","🥭","🍍","👟","🕶️","🧣","🍉","🎒"];
  const LINES=[["Bớt cho em một chút đi!","조금만 깎아 주세요!","A little discount, please!"],["Đắt quá chị ơi!","너무 비싸요!","Too expensive!"],["Rẻ hơn được không?","더 싸게 돼요?","Can it be cheaper?"],["Em lấy hai cái, bớt nhé!","두 개 살게요, 깎아 주세요!","I'll take two, give me a discount!"],["Thôi, em đi chỗ khác.","됐어요, 다른 데 갈게요.","Never mind, I'll go elsewhere."]];
  let r=0,score=0;const N=10;
  const price=()=>{if(GL===1)return (10+5*Math.floor(Math.random()*17))*1000;if(GL===2)return (100+10*Math.floor(Math.random()*90))*1000;
    const m=1+Math.floor(Math.random()*4);return m*1e6+[0,100,200,250,500,750][Math.floor(Math.random()*6)]*1000;};
  const near=p=>{const s=new Set([p]);const step=GL===1?5000:GL===2?10000:100000;let g=0;while(s.size<(GL===1?3:4)&&g++<50){const c=p+step*(Math.floor(Math.random()*7)-3)*(Math.random()<.5?1:10);if(c>0)s.add(c);}return shuffle([...s]);};
  const next=()=>{if(!alive("cho"))return;if(r>=N)return end(score,{win:score>=7,msg:tx(`${N}번 중 ${score}번 가격을 알아들었어요!`,`You understood ${score} of ${N} prices!`)});
    const p=price(),words=viNum(p)+" đồng",it=rnd(ITEMS2),opts=near(p);
    area.innerHTML=`<div class="ghud"><span>${r+1} / ${N}</span><span>✓ ${score}</span></div>
     <div class="stall"><div class="awning red"></div><div class="cust"><span class="who">👩‍🌾</span><div class="bubble2"><p class="vi">${it} ${GL===3?`<span class="blur">${esc(words)}</span>`:esc(words)}</p><button class="spk" id="csay">${ICON_SPK}</button></div></div></div>
     <p class="note center">${t("pick_price")}</p><div class="opts">${opts.map(o=>`<button class="opt" data-v="${o}">${vnd(o)}</button>`).join("")}</div><div id="cfb"></div>`;
    $("#csay").onclick=()=>speak(words);setTimeout(()=>speak(words),250);
    $$("[data-v]").forEach(b=>b.onclick=()=>{const ok=+b.dataset.v===p;$$("[data-v]").forEach(x=>{x.disabled=true;if(+x.dataset.v===p)x.classList.add("right");});if(!ok)b.classList.add("wrong");sfx(ok?"ok":"no");if(ok)score++;
      const ln=rnd(LINES);$("#cfb").innerHTML=`<div class="fb ${ok?"ok":"no"}">${bao(ok?"wink":"sad",44)}<div><p class="vi">${esc(words)} = <b>${vnd(p)}</b></p><p>💬 <span class="vi">${esc(ln[0])}</span> <small class="tr">${esc(tx(ln[1],ln[2]))}</small></p></div></div><div class="bar center"><button class="btn primary" id="cn">${t("next")} →</button></div>`;
      speak(ln[0]);$("#cn").onclick=()=>{r++;next();};});};
  next();}

/* ---------- 4. Lật thẻ văn hóa ---------- */
function memoGame(area,end){const NP=[0,4,6,8][GL];const set=shuffle(CULT).slice(0,NP);
  const cards=shuffle(set.flatMap((c,i)=>[{i,t:"vi",c},{i,t:"pic",c}]));let open=[],moves=0,found=0,lock=false;
  area.innerHTML=`<div class="ghud"><span>${t("moves")}: <b id="mv">0</b></span><span>${t("pairs")}: <b id="mf">0/${NP}</b></span></div><p class="note center">${t("tapcard")}</p>
   <div class="memo n${NP}">${cards.map((x,k)=>`<button class="mc" data-k="${k}"><span class="mc-in"><span class="mc-b">${bao("normal",44)}</span><span class="mc-f">${x.t==="vi"?`<b class="vi">${esc(x.c[0])}</b>`:`<span class="mc-e">${x.c[1]}</span><small>${esc(tx(x.c[2],x.c[3]))}</small>`}</span></span></button>`).join("")}</div><div id="mfact"></div>`;
  $$(".mc").forEach(b=>b.onclick=()=>{if(lock||b.classList.contains("up"))return;b.classList.add("up");sfx("tap");const x=cards[+b.dataset.k];if(x.t==="vi")speak(x.c[0]);open.push(b);
    if(open.length===2){moves++;$("#mv").textContent=moves;const [a,c]=open.map(o=>cards[+o.dataset.k]);
      if(a.i===c.i&&a.t!==c.t){found++;open.forEach(o=>o.classList.add("got"));open=[];sfx("ok");$("#mf").textContent=found+"/"+NP;
        $("#mfact").innerHTML=`<div class="card fact"><span class="mc-e">${a.c[1]}</span><div><b class="vi">${esc(a.c[0])}</b> · ${esc(tx(a.c[2],a.c[3]))}<p>${esc(tx(a.c[4],a.c[5]))}</p></div></div>`;
        if(found===NP)setTimeout(()=>end(Math.max(10,NP*10-(moves-NP)*3),{win:true,msg:tx(`${moves}번 만에 ${NP}쌍을 다 찾았어요!`,`Found all ${NP} pairs in ${moves} moves!`)}),1300);}
      else{lock=true;setTimeout(()=>{open.forEach(o=>o.classList.remove("up"));open=[];lock=false;},850);}}});}

 {id:"tone",ic:"🎵",vi:"Bắt dấu thanh",t:{ko:"성조 잡기",en:"Tone catcher"},fn:toneGame,unit:{ko:"개",en:"tones"},

function gamePage(id,auto){const g=GAMES.find(x=>x.id===id);page("game","games",t("games"));view.g=id;view.reFn=()=>gamePage(id);const run=view.run=(window._gr=(window._gr||0)+1);

  app().innerHTML=`<header class="gph"><span class="gc-ic big">${g.ic}</span><div><h1 class="vi">${esc(g.vi)}</h1><p>${esc(L(g.t))}${r?` · 🏆 ${[1,2,3].filter(l=>r["b"+l]!=null).map(l=>D[l][1]+" "+r["b"+l]).join(" · ")}`:""}</p></div>${spk(g.vi)}</header>
   <details class="card gd" ${r?"":"open"}><summary>🏮 ${t("what")}</summary><p>${esc(L(g.cult))}</p></details>
   <details class="card gd" ${r?"":"open"}><summary>🎮 ${t("howplay")}</summary><p>${esc(L(g.how))}</p></details>
   <div class="card garea" id="garea"><div class="gstart">${bao("wink",90,S.outfit)}<p class="gst-t">${t("choose_lv")}</p><div class="glv">${[1,2,3].map(l=>`<button class="glb ${((S.glv||{})[id]||1)===l?"on":""}" data-lv="${l}"><span>${D[l][0]}</span><b>${D[l][1]}</b><small>${D[l][2]}</small></button>`).join("")}</div></div></div>`;
  wireSay(app());const area=$("#garea");
  const end=(score,o)=>{if(view.run!==run)return;if(gameStop){try{gameStop();}catch(e){}gameStop=null;}if(!alive(id))return;o=o||{};
    const rec=S.games[id]||{best:0,plays:0};const bk="b"+GL;const nb=score>(rec[bk]||0);rec[bk]=Math.max(rec[bk]||0,score);rec.best=Math.max(rec.best,score);rec.plays++;S.games[id]=rec;
    const xp=Math.round((5+Math.min(25,score*2)+(o.win?5:0))*[0,1,1.2,1.5][GL]);
    area.innerHTML=`<div class="result">${bao(o.win?"cheer":"happy",110,S.outfit)}<p class="fb ${o.win?"ok":""}">${esc(o.msg||t("gameover"))}</p><b class="big-n">${score}</b><small>${esc(L(g.unit))} · ${D[GL][0]} ${D[GL][1]}${nb?" · 🎉 "+t("newbest"):""}</small>
     <div class="bar center"><button class="btn primary" id="gre">↻ ${t("again")}</button><button class="btn" id="glv2">${t("chg_lv")}</button><button class="btn" id="gls">${t("other")}</button></div></div>`;
    if(o.win||nb){confetti();sfx("win");}addXP(xp);
    $("#gre").onclick=()=>gamePage(id,true);$("#glv2").onclick=()=>gamePage(id);$("#gls").onclick=gamesHome;};
  const play=()=>{area.innerHTML="";area.scrollIntoView({behavior:"smooth",block:"start"});const stop=g.fn(area,end);if(typeof stop==="function")gameStop=stop;};
  $$("[data-lv]").forEach(b=>b.onclick=()=>{GL=+b.dataset.lv;S.glv[id]=GL;save();play();});
  if(auto){GL=S.glv[id]||1;play();}}

boot();
</script>
