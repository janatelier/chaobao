<title>ChàoBao · 짜오바오</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="한국인을 위한 베트남어 회화 앱 · Vietnamese for Korean speakers">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>/* Bố cục: quầy hàng rong — khung xanh rau thơm, thẻ màu vỏ bánh bao, nút đỏ ớt; dấu thanh là điểm nhấn hình ảnh */
:root{
  --bg:#F2F6EC;--surface:#FFFFFF;--surface2:#F8FBF4;--ink:#1D2A21;--muted:#56685B;--line:#D6E2D2;
  --green:#2E7D4F;--green-soft:#DCEEE1;--gold:#E9A82B;--gold-soft:#FCEFD3;--red:#D7473C;--red-soft:#FBE2DE;--blue:#4E86C9;
  --display:"Baloo 2","Jua","Noto Sans KR",system-ui,sans-serif;--body:"Be Vietnam Pro","Noto Sans KR",system-ui,sans-serif;
  --r:18px;--shadow:0 2px 0 var(--line);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111A14;--surface:#1A251D;--surface2:#16201A;--ink:#E7F0E8;--muted:#A5B8AA;--line:#2C3B31;--green:#5CC48A;--green-soft:#1E3628;--gold:#F3C25C;--gold-soft:#3A2F1A;--red:#FF6F62;--red-soft:#3E2220;--blue:#7FB2EE;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111A14;--surface:#1A251D;--surface2:#16201A;--ink:#E7F0E8;--muted:#A5B8AA;--line:#2C3B31;--green:#5CC48A;--green-soft:#1E3628;--gold:#F3C25C;--gold-soft:#3A2F1A;--red:#FF6F62;--red-soft:#3E2220;--blue:#7FB2EE;color-scheme:dark}
*{box-sizing:border-box}
html{font-size:17px}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.55;margin:0;
  background-image:radial-gradient(color-mix(in srgb,var(--green) 9%,transparent) 1.4px,transparent 1.6px);background-size:22px 22px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.vi{font-family:var(--body);font-weight:600}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
.kicker{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
.note{color:var(--muted);font-size:.9rem;margin:0}.tr{color:var(--muted);font-size:.92rem;display:block}.center{text-align:center}
.big{font-size:1.5rem;line-height:1.3;margin:.2rem 0}.big2{font-size:1.25rem}.big-n{font-family:var(--display);font-size:2.6rem;line-height:1}
mark{background:var(--gold-soft);color:var(--ink);border-radius:6px;padding:0 4px;box-shadow:inset 0 -3px 0 var(--gold)}

/* khung */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));min-height:58px}
.ab-back{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700}
#brand{display:flex;align-items:center;gap:6px;background:none;border:0;padding:0;font-family:var(--display);font-weight:800;font-size:1.35rem;color:var(--ink)}
#brand span{color:var(--green)}#brand .bao{margin-top:-4px}
#abTitle{font-weight:700;color:var(--muted);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ab-r{margin-left:auto;display:flex;gap:8px}
.ab-ic{min-width:42px;height:42px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:800;display:grid;place-items:center;padding:0 10px}
.layout{display:grid;grid-template-columns:1fr;max-width:1180px;margin:0 auto}
.side{display:none}
#app{min-width:0;padding:18px max(16px,env(safe-area-inset-right,0px)) 110px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;max-width:880px;width:100%;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;font-size:.74rem;font-weight:700;color:var(--muted)}
.tabbar button i{font-style:normal;font-size:1.25rem;line-height:1}
.tabbar button.on{color:var(--green);background:var(--green-soft)}
#foot{text-align:center;color:var(--muted);font-size:.8rem;padding:0 16px 120px}
@media (min-width:980px){
  .layout{grid-template-columns:230px 1fr;gap:10px}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:calc(70px + env(safe-area-inset-top,0px));align-self:start;padding:18px 0 18px max(16px,env(safe-area-inset-left,0px))}
  .side button{display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:14px;padding:11px 14px;font-weight:700;color:var(--muted);text-align:left}
  .side button i{font-style:normal;font-size:1.2rem}.side button.on{background:var(--green-soft);color:var(--green)}
  #sideStats{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:8px}
  #sideStats small{display:block;color:var(--muted)}
  .tabbar{display:none}#app{padding-bottom:40px}#foot{padding-bottom:30px}
}

/* thành phần chung */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card.mini{padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.bar.center{justify-content:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;font-weight:700;display:inline-flex;align-items:center;gap:8px;box-shadow:0 2px 0 var(--line)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--green) 60%,#000)}
:root[data-theme="dark"] .btn.primary{color:#0B1A10}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0B1A10}}
.btn.big{padding:13px 26px;font-size:1.05rem}.btn.sm{padding:6px 12px;font-size:.85rem}.btn.danger{color:var(--red);border-color:var(--red)}
.btn:active,.opt:active,.tile:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:default}
.spk{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--green-soft);color:var(--green);display:inline-grid;place-items:center;vertical-align:middle}
.spk.big{width:64px;height:64px}.spk.big svg{width:30px;height:30px}
.warn{background:var(--gold-soft);border:1px solid var(--gold);border-radius:14px;padding:10px 14px;font-size:.88rem;margin:0}
.phead{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,var(--green-soft),var(--gold-soft));border-radius:24px;padding:18px 20px}
.phead h1{font-size:1.75rem}.phead p{margin:.35rem 0 0;color:var(--muted);font-size:.95rem}.phead .bao{flex:none}
.phead>div{min-width:0}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:5px;position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:5}
.tabs button{flex:1;border:0;background:none;border-radius:12px;padding:10px 6px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--green);color:#fff}
.h2{font-size:1.25rem;margin-top:4px}
.chip,.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:.88rem}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips-row{display:flex;gap:8px;flex-wrap:wrap}
.sel,.inp{font:inherit;border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface);color:var(--ink);max-width:100%;width:100%}
.inp{font-size:1.15rem}

/* trang chủ */
.hero{display:grid;grid-template-columns:1fr;gap:10px;background:linear-gradient(160deg,var(--green-soft),var(--surface) 60%,var(--gold-soft));border:1px solid var(--line);border-radius:28px;padding:18px 20px 20px}
.hero-mas{display:flex;align-items:center;gap:10px}
.bubble{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 14px;font-size:.95rem;box-shadow:var(--shadow)}
.bubble::before{content:"";position:absolute;left:-8px;top:24px;border:8px solid transparent;border-right-color:var(--surface);border-left:0}
.brand-big{font-size:3rem;font-weight:800;letter-spacing:-.02em}.brand-big span{color:var(--green)}
.brand-sub{margin:.1rem 0 12px;color:var(--muted);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px}
.stat b{font-family:var(--display);font-size:1.5rem;line-height:1}.stat small{color:var(--muted);font-size:.74rem;line-height:1.25}
.ring{--p:0;width:48px;height:48px;border-radius:50%;background:conic-gradient(var(--green) calc(var(--p)*360deg),var(--line) 0);display:grid;place-items:center}
.ring span{width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.cont{display:flex;align-items:center;gap:14px;text-align:left;border:0;border-radius:22px;padding:16px 18px;background:var(--green);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--green) 55%,#000)}
:root[data-theme="dark"] .cont{color:#0B1A10}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cont{color:#0B1A10}}
.cont>span:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column}.cont small{opacity:.85;font-weight:600}.cont b{font-size:1.3rem}.cont em{font-style:normal;opacity:.9}
.cont-ic{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:1.6rem;flex:none}
.cont-go{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.daily{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:var(--r);padding:14px 18px}
.daily-top{display:flex;justify-content:space-between;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}.hero{grid-template-columns:auto 1fr;align-items:center}.hero-mas{flex-direction:column;align-items:flex-start}.bubble::before{left:30px;top:-8px;border:8px solid transparent;border-bottom-color:var(--surface);border-top:0}}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.tile b{font-size:1rem}.tile small{color:var(--muted);font-size:.78rem;line-height:1.35}
.tile-ic{font-size:1.5rem;width:44px;height:44px;border-radius:14px;background:var(--green-soft);display:grid;place-items:center;margin-bottom:4px}

/* lộ trình */
.lsec{display:flex;flex-direction:column;gap:10px}.lsec h2{font-size:1.15rem}
.lgrid{display:grid;grid-template-columns:1fr;gap:8px}@media (min-width:640px){.lgrid{grid-template-columns:1fr 1fr}}
.lrow{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow)}
.lr-ic{width:42px;height:42px;border-radius:12px;background:var(--gold-soft);display:grid;place-items:center;font-size:1.3rem;flex:none}
.lr-t{flex:1;min-width:0;display:flex;flex-direction:column}.lr-t small{color:var(--muted);font-size:.82rem}
.lr-s{font-weight:800;color:var(--muted)}.lrow.done .lr-s{color:#fff;background:var(--green);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.8rem}

/* phát âm */
.tbl-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.ptbl{width:100%;border-collapse:collapse}.ptbl th{text-align:left;font-size:.8rem;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line)}
.ptbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}.ptbl td small{display:block}.ptbl tr:last-child td{border-bottom:0}
.tones{display:grid;grid-template-columns:1fr;gap:10px}@media (min-width:640px){.tones{grid-template-columns:1fr 1fr}}
.tone{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tone-curve{flex:none;background:var(--surface2);border-radius:12px;padding:6px}.tone-name{font-size:1.1rem}.mark{font-size:1.5rem;font-weight:700;color:var(--red);margin-left:4px}
.tone p{margin:.2rem 0}
.pros{display:grid;grid-template-columns:1fr;gap:10px}@media (min-width:640px){.pros{grid-template-columns:1fr 1fr}}
.pro{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.pro p{grid-column:1/-1;margin:0;font-size:.92rem}.pro small{grid-column:1/-1;color:var(--green);font-weight:700}

/* bài giao tiếp */
.phr{display:grid;grid-template-columns:1fr;gap:8px}@media (min-width:640px){.phr{grid-template-columns:1fr 1fr}}
.pc{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 56px 12px 14px;cursor:pointer;box-shadow:var(--shadow)}
.pc b{display:block;font-size:1.08rem}.pc .spk.in,.wrow .spk.in{position:absolute;right:10px;top:50%;transform:translateY(-50%)}
.tipc{background:var(--gold-soft);border-color:color-mix(in srgb,var(--gold) 50%,var(--line))}.tipc p{margin:.4rem 0 0}
.gchips{display:flex;flex-direction:column;gap:8px}.gchips>div{display:flex;flex-wrap:wrap;gap:8px}
.tg{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem}
.tg input{width:20px;height:20px;accent-color:var(--green)}
.whoinfo{font-weight:600}
.chat{display:flex;flex-direction:column;gap:10px;background:var(--surface2);border:1px solid var(--line);border-radius:22px;padding:14px}
.msg{display:flex;align-items:flex-end;gap:8px}.msg.me{flex-direction:row-reverse}
.av{width:38px;height:38px;flex:none;display:grid;place-items:center;font-size:1.3rem}
.bub{max-width:min(82%,520px);text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.msg.me .bub{background:var(--green-soft);border-radius:18px 18px 4px 18px}
.bub b{font-size:1.05rem}.bub.playing{outline:3px solid var(--gold)}
.bub.hid b,.bub.hid small{filter:blur(7px);user-select:none}

/* luyện tập */
.quiz{display:flex;flex-direction:column;gap:12px}
.qhead{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--muted);font-size:.85rem}
.qbar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}.qbar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.qask{margin:0;color:var(--muted);font-weight:600}.qprompt{font-size:1.3rem;font-weight:600;margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.opts{display:grid;grid-template-columns:1fr;gap:8px}@media (min-width:640px){.opts{grid-template-columns:1fr 1fr}}
.opt{text-align:left;background:var(--surface2);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:1rem}
.opt.right{border-color:var(--green);background:var(--green-soft)}.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.oslot{min-height:58px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}.oslot .ph{color:var(--muted);font-size:.88rem;padding:0 6px}
.obank{display:flex;flex-wrap:wrap;gap:8px}
.ow{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-size:1.02rem;box-shadow:0 2px 0 var(--line)}.ow:disabled{opacity:.3}.ow.on{background:var(--gold-soft)}
.fb{display:flex;align-items:center;gap:10px;border-radius:14px;padding:10px 12px;margin:0}.fb.ok{background:var(--green-soft)}.fb.no{background:var(--red-soft)}.fb p{margin:.1rem 0 0}
.result{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}.result p{margin:0}
.wrongs{width:100%;text-align:left}.wrongs summary{cursor:pointer;font-weight:700;color:var(--muted)}

/* ngữ pháp */
.glist{display:grid;grid-template-columns:1fr;gap:8px}@media (min-width:640px){.glist{grid-template-columns:1fr 1fr}}
.gitem{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.gitem b{font-size:1.1rem}.gitem span{color:var(--muted);font-size:.9rem}
.lvb{font-size:.72rem;font-weight:700;border-radius:99px;padding:2px 9px;background:var(--green-soft);color:var(--green)}.lvb.l2{background:var(--gold-soft);color:color-mix(in srgb,var(--gold) 60%,var(--ink))}.lvb.l3{background:var(--red-soft);color:var(--red)}
.gcard{display:flex;flex-direction:column;align-items:flex-start;gap:8px}.gtitle{font-size:2rem}.gmean{font-size:1.1rem;font-weight:600;margin:0}
.gbox{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}.gbox p{margin:.3rem 0 0}
.exs{display:flex;flex-direction:column;gap:8px}
.exr{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}.exr p{margin:0;font-size:1.1rem}

/* từ vựng */
.vgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media (min-width:640px){.vgrid{grid-template-columns:repeat(3,1fr)}}
.vcard{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.vcard small{color:var(--muted)}.vbar{width:100%;height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:4px}.vbar i{display:block;height:100%;background:var(--gold)}
.wlist{display:grid;grid-template-columns:1fr;gap:8px}@media (min-width:640px){.wlist{grid-template-columns:1fr 1fr}}
.wrow{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 56px 10px 14px;cursor:pointer}.wrow b{display:block;font-size:1.05rem}
.flash{width:100%;max-width:440px;margin:0 auto;aspect-ratio:3/2;border:0;background:none;perspective:900px;position:relative;display:block;padding:0}
.flash>span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:24px;border:1px solid var(--line);background:var(--surface);box-shadow:0 6px 0 var(--line);backface-visibility:hidden;transition:transform .45s;padding:16px}
.flash .ff b{font-size:2rem}.flash .fbk{transform:rotateY(180deg);background:var(--green-soft)}.flash .fbk b{font-size:1.5rem}.flash .fbk em{font-style:normal;font-size:1.15rem}
.flash.on .ff{transform:rotateY(180deg)}.flash.on .fbk{transform:rotateY(360deg)}

/* nói */
.sh{display:flex;flex-direction:column;gap:12px}

/* văn hóa */
.cgrid{display:grid;grid-template-columns:1fr;gap:10px}@media (min-width:640px){.cgrid{grid-template-columns:1fr 1fr}}
.ccard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;box-shadow:var(--shadow)}
.cc-e{grid-row:span 3;font-size:2.2rem;width:58px;height:58px;border-radius:16px;background:var(--gold-soft);display:grid;place-items:center}
.ccard em{font-style:normal;color:var(--muted);font-size:.88rem}.ccard p{margin:.25rem 0 0;font-size:.9rem;grid-column:2}

/* tôi */
.mehero{display:flex;align-items:center;gap:16px}.mehero>div{flex:1;min-width:0}.mehero h1{font-size:1.6rem;margin:2px 0 8px}.mehero small{color:var(--muted)}
.mstats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media (min-width:640px){.mstats{grid-template-columns:repeat(4,1fr)}}
.mstat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center}.mstat b{font-family:var(--display);font-size:1.6rem;line-height:1.1}.mstat small{color:var(--muted);font-size:.8rem}
.wardrobe{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}@media (min-width:640px){.wardrobe{grid-template-columns:repeat(6,1fr)}}
.wd{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:8px;display:flex;flex-direction:column;align-items:center}.wd.on{border-color:var(--green);background:var(--green-soft)}.wd:disabled{opacity:.5}.wd small{font-size:.72rem;color:var(--muted)}
.settings{display:flex;flex-direction:column;gap:2px;padding:6px 16px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}.srow:last-of-type{border-bottom:0}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 12px;font-weight:700;font-size:.85rem;color:var(--muted)}.seg button[aria-pressed="true"]{background:var(--green);color:#fff}

/* trò chơi */
.ggrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gcardb{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.gcardb b{font-size:1.08rem}.gcardb small{color:var(--muted)}.gcardb em{font-style:normal;font-size:.8rem;font-weight:700;color:var(--gold)}
.gc-ic{font-size:1.8rem;width:54px;height:54px;border-radius:16px;background:var(--red-soft);display:grid;place-items:center;margin-bottom:4px}.gc-ic.big{width:64px;height:64px;font-size:2.1rem;margin:0}
.gph{display:flex;align-items:center;gap:14px}.gph>div{flex:1;min-width:0}.gph h1{font-size:1.6rem}.gph p{margin:0;color:var(--muted)}
.gd summary{cursor:pointer;font-weight:700}.gd p{margin:.6rem 0 0}
.garea{min-height:260px}
.gstart{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}.gst-t{font-weight:700;margin:0}
.glv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.glb{display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--surface2);border:2px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.glb span{font-size:1.5rem}.glb small{color:var(--muted);font-size:.76rem;line-height:1.35}.glb.on{border-color:var(--green);background:var(--green-soft)}
@media (hover:hover){.glb:hover{border-color:var(--green)}}
@media (max-width:520px){.glv{grid-template-columns:1fr}.glb{flex-direction:row;text-align:left;gap:10px}.glb small{flex:1}}
.ghud{display:flex;justify-content:space-between;gap:10px;font-weight:800;margin-bottom:10px;flex-wrap:wrap}
.tg-card{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}.tg-word{font-size:2.2rem;margin:0}
.tg-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tgb{background:var(--surface2);border:2px solid var(--line);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center}.tgb b{font-size:1.6rem;line-height:1.1}.tgb small{font-size:.8rem;color:var(--muted)}
.tgb.right{border-color:var(--green);background:var(--green-soft)}.tgb.wrong{border-color:var(--red);background:var(--red-soft)}
.stall{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--surface2);margin-bottom:10px}
.awning{height:22px;background:repeating-linear-gradient(90deg,var(--green) 0 26px,var(--surface) 26px 52px)}.awning.red{background:repeating-linear-gradient(90deg,var(--red) 0 26px,var(--surface) 26px 52px)}
.cust{display:flex;align-items:center;gap:10px;padding:12px}.who{font-size:2.4rem}
.bubble2{position:relative;flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 54px 10px 14px}.bubble2 p{margin:0;font-size:1.08rem}.bubble2 .spk{position:absolute;right:8px;top:50%;transform:translateY(-50%)}
.blur{filter:blur(6px);user-select:none}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}@media (min-width:640px){.menu{grid-template-columns:repeat(4,1fr)}}
.mi{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}.mi.on{border-color:var(--gold);background:var(--gold-soft)}
.mi-e{font-size:1.6rem}.mi b{font-size:.9rem}.mi small{color:var(--muted);font-size:.72rem}
.qty{display:flex;align-items:center;gap:8px;margin-top:4px}.qty button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);font-weight:800}.qty span{min-width:16px;font-weight:800}
.memo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.memo.n4,.memo.n8{grid-template-columns:repeat(4,1fr)}
.mc{aspect-ratio:3/4;border:0;background:none;padding:0;perspective:700px}
.mc-in{position:relative;display:block;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}.mc.up .mc-in{transform:rotateY(180deg)}
.mc-b,.mc-f{position:absolute;inset:0;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;backface-visibility:hidden;border:2px solid var(--line);padding:4px;text-align:center}
.mc-b{background:var(--green-soft)}.mc-f{background:var(--surface);transform:rotateY(180deg)}.mc-f b{font-size:.92rem}.mc-f small{font-size:.7rem;color:var(--muted);line-height:1.2}
.mc.got .mc-f{border-color:var(--green);background:var(--green-soft)}.mc-e{font-size:1.9rem}
.fact{display:flex;gap:12px;align-items:flex-start;margin-top:10px}.fact p{margin:.2rem 0 0;font-size:.92rem}

/* thông báo, pháo giấy */
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;pointer-events:none;z-index:50;display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--green);border-radius:999px;padding:4px 18px 4px 6px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.15);transition:.25s;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:3px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{top:105%;transform:rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.bao{display:block}
</style>

 dl:[["A","Alo, anh đặt Grab phải không?","여보세요, 그랩 부르셨죠?","Hello, did you book a Grab?"],["B","Vâng. Anh đến đâu rồi?","네. 어디쯤 오셨어요?","Yes. Where are you now?"],["A","Tôi sắp đến rồi. Anh đứng ở đâu?","거의 다 왔어요. 어디에 서 계세요?","Almost there. Where are you standing?"],["B","Tôi đứng trước cửa siêu thị.","마트 문 앞에 서 있어요.","In front of the supermarket."],["A","Anh đi đến tòa nhà Bitexco đúng không?","비텍스코 빌딩 가시는 거 맞죠?","You're going to Bitexco Tower, right?"],["B","Đúng rồi. Mất bao lâu anh?","맞아요. 얼마나 걸려요?","That's right. How long will it take?"],["A","Khoảng hai mươi phút.","20분 정도요.","About twenty minutes."],["B","Đến rồi, dừng ở đây nhé. Cảm ơn anh!","다 왔어요, 여기 세워 주세요. 감사합니다!","We're here, stop here please. Thanks!"]],

 ph:[["… ở đâu?","~가 어디예요?","Where is …?"],["Đi thẳng.","직진하세요.","Go straight."],["Rẽ trái ở ngã tư.","사거리에서 좌회전하세요.","Turn left at the intersection."],["Ở bên phải.","오른쪽에 있어요.","It's on the right."],["Có xa không?","멀어요?","Is it far?"],["Gần đây có ATM không?","이 근처에 ATM 있어요?","Is there an ATM near here?"],["Đi bộ mất mấy phút?","걸어서 몇 분 걸려요?","How many minutes on foot?"]],
 dl:[["B","Anh ơi, cho tôi hỏi, Nhà thờ Đức Bà ở đâu?","저기요, 뭐 좀 여쭤볼게요. 노트르담 성당이 어디예요?","Excuse me, where is Notre-Dame Cathedral?"],["A","Anh đi thẳng đường này.","이 길로 직진하세요.","Go straight along this street."],["A","Đến ngã tư thứ hai thì rẽ trái.","두 번째 사거리에서 좌회전하세요.","Turn left at the second intersection."],["B","Có xa không anh?","멀어요?","Is it far?"],["A","Không xa đâu. Đi bộ khoảng mười phút.","안 멀어요. 걸어서 10분 정도요.","Not far. About ten minutes on foot."],["B","Nhà thờ ở bên trái hay bên phải?","성당은 왼쪽이에요, 오른쪽이에요?","Is it on the left or right?"],["A","Ở bên phải, đối diện bưu điện.","오른쪽, 우체국 맞은편이에요.","On the right, opposite the post office."],["B","Cảm ơn anh nhiều!","정말 감사합니다!","Thanks a lot!"]],

 ph:[["Bây giờ là mấy giờ?","지금 몇 시예요?","What time is it now?"],["Bây giờ là ba giờ chiều.","지금 오후 세 시예요.","It's 3 p.m."],["Bảy giờ rưỡi.","일곱 시 반.","Half past seven."],["hôm nay / ngày mai / hôm qua","오늘 / 내일 / 어제","today / tomorrow / yesterday"],["Thứ bảy này bạn rảnh không?","이번 토요일에 시간 있어요?","Are you free this Saturday?"],["Mình gặp nhau lúc mấy giờ?","우리 몇 시에 만나요?","What time shall we meet?"],["Xin lỗi, tôi đến muộn.","늦어서 미안해요.","Sorry I'm late."]],

{id:"dongnghiep",lv:2,ic:"☕",vi:"Nói chuyện với đồng nghiệp",t:{ko:"동료와 스몰토크",en:"Small talk with coworkers"},
 who:{A:{ko:"뚜언 (동료)",en:"Tuấn (coworker)"},B:{ko:"민호 (나)",en:"Minho (you)"}},
 ph:[["Cuối tuần bạn làm gì?","주말에 뭐 했어요?","What did you do on the weekend?"],["Ăn trưa chưa?","점심 먹었어요?","Have you had lunch?"],["Đi ăn trưa không?","점심 먹으러 갈래요?","Want to go for lunch?"],["Hôm nay mệt quá.","오늘 너무 피곤해요.","I'm so tired today."],["Cố lên!","힘내요!","Hang in there!"],["Dạo này công việc thế nào?","요즘 일은 어때요?","How's work these days?"],["Bận lắm, nhưng vui.","많이 바쁘지만 즐거워요.","Very busy, but fun."]],
 dl:[["A","Anh Minho ăn trưa chưa?","민호 씨, 점심 먹었어요?","Minho, have you had lunch?"],["B","Chưa. Đi ăn cơm tấm không?","아직요. 껌떰 먹으러 갈래요?","Not yet. Want to get broken rice?"],["A","Đi! Cuối tuần anh làm gì?","가요! 주말에 뭐 했어요?","Let's go! What did you do this weekend?"],["B","Tôi đi Vũng Tàu với bạn. Vui lắm!","친구랑 붕따우에 갔어요. 정말 재밌었어요!","I went to Vũng Tàu with friends. It was fun!"],["A","Thích nhỉ! Còn em thì ở nhà ngủ cả ngày.","좋겠다! 저는 하루 종일 집에서 잤어요.","Nice! I just slept at home all day."],["B","Dạo này công việc của em thế nào?","요즘 일은 어때요?","How's your work lately?"],["A","Bận lắm anh ạ. Mệt quá!","너무 바빠요. 피곤해요!","Very busy. So tired!"],["B","Cố lên nhé!","힘내요!","Hang in there!"]],

{id:"nhau",lv:3,ic:"🍻",vi:"Đi nhậu",t:{ko:"회식과 술자리",en:"Drinks with colleagues"},

 ph:[["Một, hai, ba, dô!","하나, 둘, 셋, 건배!","One, two, three, cheers!"],["Trăm phần trăm!","원샷!","Bottoms up!"],["Uống từ từ thôi.","천천히 마셔요.","Drink slowly."],["Tôi không uống được nhiều.","저는 많이 못 마셔요.","I can't drink much."],["Hôm nay tôi mời.","오늘은 제가 살게요.","It's on me today."],["Chúc sức khỏe!","건강을 위하여!","To your health!"],["Tôi say rồi.","취했어요.","I'm drunk."]],

 ph:[["Chúng ta bắt đầu họp nhé.","회의를 시작하겠습니다.","Let's start the meeting."],["Tiến độ dự án thế nào?","프로젝트 진행 상황은 어때요?","How is the project progressing?"],["Báo cáo này phải nộp trước thứ sáu.","이 보고서는 금요일 전까지 제출해야 해요.","This report must be submitted before Friday."],["Có ai có ý kiến gì không?","의견 있는 분 있어요?","Does anyone have any thoughts?"],["Tôi đồng ý.","동의합니다.","I agree."],["Để tôi kiểm tra lại.","다시 확인해 볼게요.","Let me double-check."],["Hôm nay đến đây thôi.","오늘은 여기까지 하죠.","Let's stop here for today."]],
 dl:[["B","Chúng ta bắt đầu họp nhé. Tiến độ dự án thế nào rồi?","회의 시작할게요. 프로젝트 진행은 어떻게 됐어요?","Let's begin. How's the project going?"],["A","Dạ, đã xong khoảng bảy mươi phần trăm ạ.","네, 70% 정도 끝났어요.","About 70% done."],["B","Tốt. Báo cáo phải nộp trước thứ sáu nhé.","좋아요. 보고서는 금요일 전까지 내야 해요.","Good. The report is due before Friday."],["A","Dạ, nhưng phần số liệu còn thiếu một chút.","네, 그런데 데이터 부분이 조금 부족해요.","Yes, but the data section is a little incomplete."],["B","Vậy em cần thêm thời gian không?","그럼 시간이 더 필요해요?","Do you need more time then?"],["A","Dạ, cho em thêm một ngày được không ạ?","네, 하루만 더 주실 수 있을까요?","Could I have one more day?"],["B","Được. Có ai có ý kiến gì không? Nếu không thì hôm nay đến đây thôi.","좋아요. 다른 의견 있어요? 없으면 오늘은 여기까지 하죠.","Okay. Any other thoughts? If not, let's stop here."]],

{id:"phannan",lv:3,ic:"🔧",vi:"Phàn nàn & sửa chữa",t:{ko:"불편 사항 말하기",en:"Complaints & repairs"},

 ph:[["Máy lạnh nhà tôi bị hỏng.","우리 집 에어컨이 고장 났어요.","My air conditioner is broken."],["Nước bị rò rỉ.","물이 새요.","Water is leaking."],["Khi nào thợ có thể đến?","기사님이 언제 올 수 있어요?","When can the repairman come?"],["Làm ơn sửa sớm giúp tôi.","빨리 고쳐 주세요.","Please fix it soon."],["Phòng bên cạnh ồn quá.","옆집이 너무 시끄러워요.","The neighbors are too noisy."],["Cái này không đúng với đơn tôi đặt.","이건 제가 주문한 거랑 달라요.","This isn't what I ordered."],["Tôi muốn đổi trả.","교환·환불하고 싶어요.","I'd like to return it."]],

 tip:{ko:"불편을 말할 때도 웃으면서 부드럽게 말하는 게 베트남식이에요. 화를 내면 오히려 일이 늦어질 수 있어요. 'làm ơn ~ giúp tôi'(~ 좀 해 주세요)를 기억하세요.",en:"Even when complaining, a calm smile works best in Vietnam; getting angry can slow things down. Remember 'làm ơn ~ giúp tôi' (please ~ for me)."}},
{id:"khen",lv:3,ic:"🌟",vi:"Khen & động viên",t:{ko:"칭찬과 격려",en:"Compliments & encouragement"},

 ph:[["Em làm tốt lắm!","정말 잘했어요!","You did great!"],["Bạn hôm nay đẹp quá!","오늘 정말 예뻐요!","You look great today!"],["Giỏi quá!","대단해요!","Amazing!"],["Đừng lo, lần sau sẽ tốt hơn.","걱정 마요, 다음엔 더 잘될 거예요.","Don't worry, next time will be better."],["Cảm ơn em đã giúp anh.","도와줘서 고마워요.","Thanks for helping me."],["Quá khen rồi!","과찬이세요!","You flatter me!"],["Chúc mừng em!","축하해요!","Congratulations!"]],

 ph:[["Chúc mừng năm mới!","새해 복 많이 받으세요!","Happy New Year!"],["Chúc anh an khang thịnh vượng.","평안하고 번창하시길 바랍니다.","Wishing you peace and prosperity."],["Chúc cô chú sức khỏe dồi dào.","건강하세요. (어른께)","Wishing you good health. (to elders)"],["Vạn sự như ý!","만사형통하세요!","May everything go as you wish!"],["Lì xì cho cháu.","세뱃돈 줄게.","Here's some lucky money."],["Tết này bạn về quê không?","이번 뗏에 고향에 가요?","Are you going home for Tết?"],["Năm nay là năm con gì?","올해는 무슨 띠예요?","Which zodiac year is it?"]],
 dl:[["B","Chúc mừng năm mới cô chú! Chúc cô chú sức khỏe dồi dào, vạn sự như ý.","새해 복 많이 받으세요! 건강하시고 만사형통하세요.","Happy New Year! Wishing you health and all the best."],["A","Cảm ơn cháu! Chúc cháu một năm mới thành công. Lì xì cho cháu này.","고마워요! 새해에 성공하길 바라요. 세뱃돈 받아요.","Thank you! Wishing you success. Here's some lucky money."],["B","Ôi, cháu cảm ơn cô chú ạ.","와, 감사합니다.","Oh, thank you so much."],["A","Ở Hàn Quốc có Tết không cháu?","한국에도 설이 있어요?","Is there a New Year holiday in Korea?"],["B","Có ạ, gọi là Seollal. Mọi người cũng ăn canh bánh gạo.","네, 설날이라고 해요. 떡국도 먹어요.","Yes, it's called Seollal. We eat rice-cake soup."],["A","Giống Việt Nam ăn bánh chưng nhỉ!","베트남에서 바잉쯩을 먹는 거랑 비슷하네요!","Like how we eat bánh chưng!"],["B","Dạ, đúng rồi ạ!","네, 맞아요!","Yes, exactly!"]],
 g:["chuc","nhi","giong"],
 tip:{ko:"뗏(Tết)은 베트남 최대 명절이에요. 빨간 봉투(lì xì)에 새 지폐를 넣어 아이들과 어른께 드려요. 한국 설날과 비슷하게 1~2주 동안 많은 가게가 쉬어요.",en:"Tết is Vietnam's biggest holiday. Lucky money goes in red envelopes (lì xì) with crisp new notes. Like Seollal, many shops close for one or two weeks."}},

{id:"xungho",lv:1,g:"anh / chị / em",m:{ko:"호칭으로 '나·너' 말하기",en:"Kinship pronouns for I/you"},f:{ko:"상대가 나보다 나이 많은 남자 → anh, 여자 → chị, 어린 사람 → em. 나는 그에 맞춰 em / anh / chị.",en:"Older man → anh, older woman → chị, younger → em. You call yourself the matching term."},ex:[["{Anh} có khỏe không?","(형/오빠) 잘 지내요?","Are you well? (to an older man)"],["{Em} cảm ơn chị.","(제가) 고마워요, 언니.","Thank you. (younger speaker to older woman)"],["Chị ơi, {em} hỏi chút.","언니, 뭐 좀 물어볼게요.","Miss, may I ask something?"]],d:["tôi","bạn","nó"]},
{id:"khong_q",lv:1,g:"(có) … không?",m:{ko:"~해요? (예/아니요 질문)",en:"Yes/no question"},f:{ko:"(có) + 동사/형용사 + không? 대답: Có (네) / Không (아니요)",en:"(có) + verb/adjective + không? Answer: Có (yes) / Không (no)."},ex:[["Anh có khỏe {không}?","잘 지내요?","Are you well?"],["Món này có cay {không}?","이거 매워요?","Is this spicy?"],["Bạn có thích phở {không}?","쌀국수 좋아해요?","Do you like pho?"]],d:["chưa","gì","đâu"]},
{id:"khong_neg",lv:1,g:"không + 동사",m:{ko:"~하지 않다 (부정)",en:"Negation: not"},f:{ko:"동사·형용사 앞에 không을 붙여요.",en:"Put không before the verb or adjective."},ex:[["Tôi {không} ăn rau mùi.","저는 고수를 안 먹어요.","I don't eat coriander."],["Hôm nay {không} lạnh.","오늘은 안 추워요.","It's not cold today."],["Tôi {không} hiểu.","이해가 안 돼요.","I don't understand."]],d:["chưa","đã","rất"]},
{id:"la",lv:1,g:"A là B",m:{ko:"A는 B이다",en:"A is B (nouns)"},f:{ko:"명사와 명사를 연결해요. 형용사 앞에는 là를 쓰지 않아요 (Tôi là đẹp ✗).",en:"Links two nouns. Don't use là before adjectives (Tôi là đẹp ✗)."},ex:[["Tôi {là} người Hàn Quốc.","저는 한국 사람이에요.","I am Korean."],["Đây {là} bạn tôi.","이 사람은 제 친구예요.","This is my friend."],["Hôm nay {là} thứ hai.","오늘은 월요일이에요.","Today is Monday."]],d:["có","ở","thì"]},
{id:"cung",lv:1,g:"cũng",m:{ko:"~도 (역시)",en:"also, too"},f:{ko:"주어 뒤, 동사 앞에 놓아요.",en:"Goes after the subject, before the verb."},ex:[["Tôi {cũng} khỏe.","저도 잘 지내요.","I'm fine too."],["Em {cũng} thích K-pop.","저도 K-pop 좋아해요.","I like K-pop too."],["Anh ấy {cũng} là người Hàn.","그도 한국 사람이에요.","He's Korean too."]],d:["còn","rất","đã"]},
{id:"gi",lv:1,g:"… gì?",m:{ko:"무엇?",en:"what?"},f:{ko:"문장 끝이나 명사 뒤에 놓아요: tên là gì? (이름이 뭐예요?), món gì? (무슨 음식?)",en:"At the end, or after a noun: tên là gì? (what's your name), món gì? (what dish?)"},ex:[["Bạn tên là {gì}?","이름이 뭐예요?","What's your name?"],["Anh uống {gì}?","뭐 마실래요?","What will you drink?"],["Đây là cái {gì}?","이건 뭐예요?","What is this?"]],d:["đâu","nào","ai"]},
{id:"dang",lv:1,g:"đang + 동사",m:{ko:"~하는 중이다 (진행)",en:"be doing (progressive)"},f:{ko:"동사 앞에 đang을 놓아요.",en:"Put đang before the verb."},ex:[["Tôi {đang} học tiếng Việt.","베트남어를 배우는 중이에요.","I'm learning Vietnamese."],["Chị ấy {đang} họp.","그녀는 회의 중이에요.","She's in a meeting."],["Trời {đang} mưa.","비가 오고 있어요.","It's raining."]],d:["đã","sẽ","vừa"]},
{id:"oi",lv:1,g:"호칭 + ơi",m:{ko:"~야, 저기요 (부르기)",en:"Calling someone"},f:{ko:"부르는 사람의 호칭이나 이름 뒤에 ơi. 식당 직원을 부를 때 'em ơi', 'chị ơi'.",en:"Name or pronoun + ơi. Call staff with 'em ơi' or 'chị ơi'."},ex:[["Em {ơi}, cho anh tính tiền.","저기요, 계산해 주세요.","Excuse me, the check please."],["Minho {ơi}, đi ăn không?","민호야, 밥 먹으러 갈래?","Minho, want to eat?"],["Mẹ {ơi}!","엄마!","Mom!"]],d:["à","nhé","ạ"]},
{id:"a_lich_su",lv:1,g:"dạ … ạ",m:{ko:"공손한 말투 (존댓말)",en:"Polite particles"},f:{ko:"윗사람에게 문장 앞에 Dạ (네), 끝에 ạ를 붙이면 공손해져요.",en:"To elders, start with Dạ (yes) and end with ạ to be polite."},ex:[["Dạ, em cảm ơn chị {ạ}.","네, 감사합니다.","Yes, thank you (polite)."],["Chào cô {ạ}.","선생님 안녕하세요.","Hello, ma'am (polite)."],["{Dạ}, em hiểu rồi.","네, 알겠습니다.","Yes, I understand."]],d:["nhé","à","ơi"]},
{id:"duoc_khong",lv:1,g:"… được không?",m:{ko:"~해도 돼요? / ~해 줄 수 있어요?",en:"Can I / could you …?"},f:{ko:"문장 끝에 được không? 대답: Được (돼요) / Không được (안 돼요).",en:"Add được không? at the end. Answer: Được (yes) / Không được (no)."},ex:[["Trả bằng thẻ {được không}?","카드로 내도 돼요?","Can I pay by card?"],["Nói chậm lại {được không}?","천천히 말해 줄 수 있어요?","Could you speak slowly?"],["Tôi ngồi đây {được không}?","여기 앉아도 돼요?","May I sit here?"]],d:["phải không","không ạ","chưa"]},
{id:"bao_nhieu",lv:1,g:"bao nhiêu",m:{ko:"얼마, 몇 (큰 수)",en:"how much / how many"},f:{ko:"가격, 나이, 10 이상의 수를 물을 때.",en:"For prices, age and numbers above ten."},ex:[["Cái này {bao nhiêu} tiền?","이거 얼마예요?","How much is this?"],["Bạn {bao nhiêu} tuổi?","몇 살이에요?","How old are you?"],["Công ty có {bao nhiêu} người?","회사에 몇 명 있어요?","How many people work at the company?"]],d:["mấy giờ","ở đâu","thế nào"]},
{id:"so_dem",lv:1,g:"mốt · lăm · tư · mươi",m:{ko:"숫자 읽기 규칙",en:"Number-reading rules"},f:{ko:"20 이상에서 1은 mốt, 4는 tư로 읽고, 15·25…의 5는 lăm으로 읽어요. 10은 mười, 20부터는 mươi.",en:"From 20 up, 1 becomes mốt and 4 often tư; the 5 in 15, 25… becomes lăm. 10 = mười, tens from 20 = mươi."},ex:[["21 = hai mươi {mốt}","21","21"],["15 = mười {lăm}","15","15"],["34 = ba mươi {tư}","34","34"]],d:["một","năm","bốn"]},
{id:"cho_toi",lv:1,g:"Cho tôi …",m:{ko:"~ 주세요",en:"Give me … / I'll have …"},f:{ko:"주문하거나 부탁할 때 가장 많이 쓰는 표현.",en:"The go-to phrase for ordering or asking."},ex:[["{Cho tôi} một ly trà đá.","아이스티 한 잔 주세요.","An iced tea, please."],["{Cho tôi} xem thực đơn.","메뉴판 보여 주세요.","Let me see the menu."],["{Cho tôi} hỏi một chút.","뭐 좀 여쭤볼게요.","May I ask something?"]],d:["Tôi là","Có không","Đi"]},
{id:"hay",lv:1,g:"A hay B?",m:{ko:"A 아니면 B?",en:"A or B? (questions)"},f:{ko:"질문에서 '또는'은 hay, 평서문에서는 hoặc.",en:"Use hay for 'or' in questions, hoặc in statements."},ex:[["Uống ở đây {hay} mang về?","여기서 드세요, 가져가세요?","For here or to go?"],["Bên trái {hay} bên phải?","왼쪽이요, 오른쪽이요?","Left or right?"],["Cà phê {hay} trà?","커피요, 차요?","Coffee or tea?"]],d:["và","với","nhưng"]},
{id:"nhe",lv:1,g:"… nhé / nha",m:{ko:"~하자, ~해요 (부드러운 제안)",en:"Soft suggestion, 'okay?'"},f:{ko:"문장 끝에 붙여 부드럽게 만들어요. 남부에서는 nha를 많이 써요.",en:"Softens the sentence. Southerners often say nha."},ex:[["Mình đi ăn {nhé}!","우리 밥 먹으러 가자!","Let's go eat, okay?"],["Ít đường thôi {nhé}.","설탕 조금만이요.","Just a little sugar, okay?"],["Hẹn gặp lại {nha}!","또 봐요!","See you, okay?"]],d:["không","chưa","gì"]},
{id:"qua_lam",lv:1,g:"rất / lắm / quá",m:{ko:"매우, 너무",en:"very / so"},f:{ko:"rất + 형용사, 형용사 + lắm, 형용사 + quá (감탄).",en:"rất + adj, adj + lắm, adj + quá (exclamation)."},ex:[["Ngon {quá}!","정말 맛있다!","So delicious!"],["Phở {rất} ngon.","쌀국수는 아주 맛있어요.","Pho is very tasty."],["Đắt {lắm}.","많이 비싸요.","It's very expensive."]],d:["không","cũng","chưa"]},
{id:"o_dau",lv:1,g:"… ở đâu?",m:{ko:"어디에 있어요?",en:"Where is …?"},f:{ko:"ở = ~에 있다, đâu = 어디.",en:"ở = to be at, đâu = where."},ex:[["Nhà vệ sinh {ở đâu}?","화장실 어디예요?","Where's the restroom?"],["Bạn sống {ở đâu}?","어디 살아요?","Where do you live?"],["Anh đang {ở đâu}?","지금 어디 있어요?","Where are you now?"]],d:["bao nhiêu","là gì","khi nào"]},
{id:"roi",lv:1,g:"… rồi",m:{ko:"이미 ~했다, ~됐다",en:"already / now (done)"},f:{ko:"동작이 끝났거나 상태가 바뀌었음을 나타내요.",en:"Shows an action is done or a state has changed."},ex:[["Tôi ăn {rồi}.","먹었어요.","I've already eaten."],["Đến {rồi}!","도착했어요!","We're here!"],["Hiểu {rồi}.","알겠어요.","Got it."]],d:["chưa","không","đang"]},
{id:"phai_khong",lv:1,g:"… phải không?",m:{ko:"~죠? 맞죠?",en:"…, right?"},f:{ko:"확인하는 질문. 대답: Phải / Đúng rồi (맞아요).",en:"Tag question. Answer: Phải / Đúng rồi (that's right)."},ex:[["Anh là người Hàn, {phải không}?","한국 분이시죠?","You're Korean, right?"],["Hôm nay thứ sáu, {phải không}?","오늘 금요일 맞죠?","Today is Friday, right?"],["Chị đặt Grab {phải không}?","그랩 부르셨죠?","You booked a Grab, right?"]],d:["được không","bao nhiêu","ở đâu"]},
{id:"thi",lv:2,g:"… thì …",m:{ko:"~는, ~하면 (주제·연결)",en:"as for / then"},f:{ko:"앞부분을 주제로 강조하거나 조건과 결과를 이어요.",en:"Marks a topic or links a condition to its result."},ex:[["Còn anh {thì} sao?","당신은요?","And how about you?"],["Đến ngã tư {thì} rẽ trái.","사거리에 가면 좌회전하세요.","When you reach the intersection, turn left."],["Tôi {thì} thích trà hơn.","저는 차가 더 좋아요.","As for me, I prefer tea."]],d:["là","mà","nên"]},
{id:"may_gio",lv:1,g:"mấy giờ",m:{ko:"몇 시",en:"what time"},f:{ko:"mấy = 몇 (작은 수), giờ = 시. 문장 끝에 오면 '몇 시예요?', 앞에 오면 '몇 시에 ~해요?'",en:"mấy = how many (small), giờ = o'clock. Sentence-final asks the time; sentence-initial asks 'at what time…'."},ex:[["Bây giờ là {mấy giờ}?","지금 몇 시예요?","What time is it?"],["{Mấy giờ} chúng ta họp?","몇 시에 회의해요?","What time do we meet?"],["Anh đi làm lúc {mấy giờ}?","몇 시에 출근해요?","What time do you go to work?"]],d:["bao lâu","khi nào","bao nhiêu"]},
{id:"neu_thi",lv:2,g:"Nếu … thì …",m:{ko:"만약 ~하면 …",en:"If … then …"},f:{ko:"조건절 앞에 nếu, 결과절 앞에 thì.",en:"nếu before the condition, thì before the result."},ex:[["{Nếu} trời mưa thì tôi ở nhà.","비가 오면 집에 있을 거예요.","If it rains, I'll stay home."],["{Nếu} không hiểu thì hỏi tôi.","모르면 저한테 물어보세요.","If you don't understand, ask me."],["{Nếu} rảnh thì đi cà phê nhé.","시간 되면 커피 마시러 가요.","If you're free, let's get coffee."]],d:["Vì","Để","Khi"]},
{id:"se",lv:2,g:"sẽ + 동사",m:{ko:"~할 것이다 (미래)",en:"will (future)"},f:{ko:"동사 앞에 sẽ. 시간 표현이 있으면 생략 가능해요.",en:"sẽ before the verb; can be dropped when a time word is present."},ex:[["Tôi {sẽ} gọi lại sau.","나중에 다시 전화할게요.","I'll call back later."],["Ngày mai trời {sẽ} mưa.","내일 비가 올 거예요.","It will rain tomorrow."],["Chiều nay thợ {sẽ} đến.","오늘 오후에 기사님이 올 거예요.","The technician will come this afternoon."]],d:["đã","đang","rồi"]},
{id:"chua",lv:2,g:"… chưa? / chưa …",m:{ko:"~했어요? / 아직 안 ~했다",en:"yet? / not yet"},f:{ko:"질문: 동사 + chưa? 대답: rồi (했어요) / chưa (아직이요).",en:"Question: verb + chưa? Answer: rồi (yes, already) / chưa (not yet)."},ex:[["Anh ăn cơm {chưa}?","밥 먹었어요?","Have you eaten?"],["Tôi {chưa} lập gia đình.","아직 결혼 안 했어요.","I'm not married yet."],["Anh giao đến {chưa}?","배달 도착했어요?","Have you arrived?"]],d:["không","rồi","đâu"]},
{id:"da",lv:2,g:"đã + 동사",m:{ko:"~했다 (과거)",en:"past (did / have done)"},f:{ko:"동사 앞에 đã. 문장 끝 rồi와 함께 쓰기도 해요.",en:"đã before the verb; often paired with rồi at the end."},ex:[["Tôi {đã} đặt phòng rồi.","방을 예약했어요.","I've booked a room."],["Tôi {đã} trả qua app rồi.","앱으로 결제했어요.","I paid in the app."],["Hôm qua tôi {đã} đi chợ.","어제 시장에 갔어요.","I went to the market yesterday."]],d:["sẽ","đang","sắp"]},
{id:"muon",lv:2,g:"muốn + 동사",m:{ko:"~하고 싶다",en:"want to"},f:{ko:"muốn 뒤에 동사를 놓아요.",en:"muốn + verb."},ex:[["Tôi {muốn} đổi tiền.","환전하고 싶어요.","I want to exchange money."],["Em {muốn} đi Hàn Quốc.","한국에 가고 싶어요.","I want to go to Korea."],["Anh {muốn} uống gì?","뭐 마시고 싶어요?","What do you want to drink?"]],d:["phải","bị","được"]},
{id:"tu_den",lv:2,g:"từ … đến …",m:{ko:"~부터 ~까지",en:"from … to …"},f:{ko:"시간과 장소 모두에 써요.",en:"For both time and place."},ex:[["{Từ} sáu giờ đến mười giờ.","6시부터 10시까지.","From six to ten."],["Đi {từ} Hà Nội đến Sài Gòn.","하노이에서 사이공까지 가요.","Go from Hanoi to Saigon."],["Làm việc {từ} thứ hai đến thứ sáu.","월요일부터 금요일까지 일해요.","Work Monday to Friday."]],d:["ở","cho","với"]},
{id:"phai",lv:2,g:"phải + 동사",m:{ko:"~해야 한다",en:"must / have to"},f:{ko:"의무를 나타내요. 부정: không cần (~할 필요 없다).",en:"Obligation. Negative: không cần (no need to)."},ex:[["Báo cáo {phải} nộp trước thứ sáu.","보고서는 금요일 전까지 내야 해요.","The report must be in before Friday."],["Tôi {phải} đi làm.","출근해야 해요.","I have to go to work."],["{Phải} đặt cọc mấy tháng?","보증금은 몇 달 치 내야 해요?","How many months' deposit?"]],d:["muốn","được","bị"]},
{id:"co_khong",lv:2,g:"có / không có",m:{ko:"있다 / 없다",en:"have / there is"},f:{ko:"có = 있다, 소유와 존재 모두. không có = 없다.",en:"có = have / there is. không có = don't have / there isn't."},ex:[["Tôi {có} một con trai.","아들이 하나 있어요.","I have a son."],["Gần đây {có} ATM không?","이 근처에 ATM 있어요?","Is there an ATM nearby?"],["Ở đây {không có} wifi.","여기는 와이파이가 없어요.","There's no Wi-Fi here."]],d:["là","ở","được"]},
{id:"khi_nao",lv:2,g:"khi nào",m:{ko:"언제",en:"when"},f:{ko:"문장 앞: 미래 (언제 ~할 거예요?), 문장 끝: 과거 (언제 ~했어요?)",en:"At the start: future (when will…?). At the end: past (when did…?)."},ex:[["{Khi nào} tôi có thể dọn vào?","언제 입주할 수 있어요?","When can I move in?"],["Anh đến Việt Nam {khi nào}?","베트남에 언제 왔어요?","When did you come to Vietnam?"],["{Khi nào} rảnh thì đi cà phê nhé.","시간 날 때 커피 마시러 가요.","Let's get coffee whenever you're free."]],d:["ở đâu","bao nhiêu","tại sao"]},
{id:"bi",lv:2,g:"bị + 동사/증상",m:{ko:"(안 좋은 일을) 당하다",en:"suffer / be (negative)"},f:{ko:"아프거나 안 좋은 일을 겪을 때. 좋은 일에는 được을 써요.",en:"For illness or bad experiences. For good things, use được."},ex:[["Tôi {bị} đau đầu.","머리가 아파요.","I have a headache."],["Tôi {bị} móc túi.","소매치기를 당했어요.","I got pickpocketed."],["Máy lạnh {bị} hỏng.","에어컨이 고장 났어요.","The AC is broken."]],d:["được","có","phải"]},
{id:"sau_khi",lv:2,g:"trước khi / sau khi",m:{ko:"~하기 전에 / ~한 후에",en:"before / after (doing)"},f:{ko:"동사나 문장 앞에 놓아요.",en:"Placed before a verb or clause."},ex:[["Uống thuốc {sau khi} ăn.","식후에 약을 드세요.","Take the medicine after eating."],["Rửa tay {trước khi} ăn.","먹기 전에 손을 씻어요.","Wash your hands before eating."],["{Sau khi} tan làm, tôi đi tập gym.","퇴근 후에 헬스장에 가요.","After work, I go to the gym."]],d:["khi nào","nếu","vì"]},
{id:"bao_lau",lv:2,g:"bao lâu",m:{ko:"얼마나 오래",en:"how long"},f:{ko:"걸리는 시간이나 기간을 물어요. mất bao lâu = 얼마나 걸려요?",en:"Asks about duration. mất bao lâu = how long does it take?"},ex:[["Mất {bao lâu}?","얼마나 걸려요?","How long does it take?"],["Bạn học tiếng Việt {bao lâu} rồi?","베트남어 배운 지 얼마나 됐어요?","How long have you studied Vietnamese?"],["{Bao lâu} thì có thẻ?","카드는 얼마나 걸려요?","How long until the card is ready?"]],d:["mấy giờ","bao nhiêu","khi nào"]},
{id:"sap",lv:2,g:"sắp + 동사",m:{ko:"곧 ~하려고 하다",en:"about to"},f:{ko:"아주 가까운 미래. sắp … rồi = 곧 ~해요.",en:"Near future. sắp … rồi = almost / about to."},ex:[["Trời {sắp} mưa.","곧 비가 올 거예요.","It's about to rain."],["Tôi {sắp} đến rồi.","거의 다 왔어요.","I'm almost there."],["Phim {sắp} bắt đầu.","영화가 곧 시작해요.","The movie is about to start."]],d:["đã","vừa","đang"]},
{id:"nhi",lv:2,g:"… nhỉ?",m:{ko:"~죠? ~네요 (동의 구하기)",en:"…, isn't it? (seeking agreement)"},f:{ko:"상대의 공감을 바라며 문장 끝에.",en:"At the end, inviting agreement."},ex:[["Hôm nay nóng quá {nhỉ}!","오늘 너무 덥죠!","So hot today, isn't it!"],["Món này ngon {nhỉ}?","이거 맛있죠?","This is good, isn't it?"],["Giống bánh chưng {nhỉ}!","바잉쯩이랑 비슷하네요!","Just like bánh chưng!"]],d:["không","chưa","à"]},
{id:"the_nao",lv:2,g:"… thế nào?",m:{ko:"어때요? 어떻게?",en:"how? how is …?"},f:{ko:"상태나 방법을 물어요. 남부에서는 sao를 많이 써요.",en:"Asks about state or manner. Southerners often say sao."},ex:[["Bạn thấy Việt Nam {thế nào}?","베트남 어때요?","How do you find Vietnam?"],["Công việc {thế nào}?","일은 어때요?","How's work?"],["Món này ăn {thế nào}?","이건 어떻게 먹어요?","How do you eat this?"]],d:["ở đâu","là gì","bao nhiêu"]},
{id:"duoc_time",lv:3,g:"… được + 기간 + rồi",m:{ko:"~한 지 (기간) 됐다",en:"have been … for (time)"},f:{ko:"동사 + được + 기간 + rồi.",en:"verb + được + duration + rồi."},ex:[["Tôi sang Việt Nam {được} một năm rồi.","베트남에 온 지 1년 됐어요.","I've been in Vietnam for a year."],["Tôi học tiếng Việt {được} ba tháng rồi.","베트남어 배운 지 3개월 됐어요.","I've studied Vietnamese for three months."],["Chúng tôi quen nhau {được} hai năm rồi.","우리는 알고 지낸 지 2년 됐어요.","We've known each other for two years."]],d:["bị","phải","cho"]},
{id:"chua_bao_gio",lv:3,g:"chưa … bao giờ",m:{ko:"한 번도 ~해 본 적 없다",en:"have never"},f:{ko:"경험이 없음을 나타내요. 질문: Bạn đã … bao giờ chưa?",en:"Never done. Question: Bạn đã … bao giờ chưa?"},ex:[["Em {chưa} đến Hàn Quốc bao giờ.","한국에 한 번도 가 본 적 없어요.","I've never been to Korea."],["Tôi {chưa} ăn sầu riêng bao giờ.","두리안을 먹어 본 적 없어요.","I've never eaten durian."],["Bạn đã đi Đà Lạt bao giờ {chưa}?","달랏에 가 본 적 있어요?","Have you ever been to Đà Lạt?"]],d:["không","đã","rồi"]},
{id:"nhat",lv:3,g:"… nhất",m:{ko:"가장 ~하다 (최상급)",en:"the most (superlative)"},f:{ko:"형용사·동사 뒤에 nhất.",en:"Put nhất after the adjective or verb."},ex:[["Em thích BTS {nhất}.","저는 BTS가 제일 좋아요.","I like BTS the most."],["Đây là quán ngon {nhất}.","여기가 제일 맛있는 식당이에요.","This is the best restaurant."],["Bệnh viện gần {nhất} ở đâu?","가장 가까운 병원이 어디예요?","Where's the nearest hospital?"]],d:["hơn","lắm","quá"]},
{id:"hon",lv:3,g:"A … hơn B",m:{ko:"A가 B보다 더 ~하다 (비교)",en:"A is more … than B"},f:{ko:"형용사 + hơn + 비교 대상.",en:"adjective + hơn + compared item."},ex:[["Tiếng Hàn khó {hơn} tiếng Việt không?","한국어가 베트남어보다 어려워요?","Is Korean harder than Vietnamese?"],["Hà Nội lạnh {hơn} Sài Gòn.","하노이가 사이공보다 추워요.","Hanoi is colder than Saigon."],["Lần sau sẽ tốt {hơn}.","다음엔 더 좋아질 거예요.","Next time will be better."]],d:["nhất","lắm","cũng"]},
{id:"may",lv:3,g:"mấy",m:{ko:"몇 (10 이하의 작은 수)",en:"how many (small numbers)"},f:{ko:"보통 10 이하로 예상될 때 써요. 큰 수는 bao nhiêu.",en:"Used when the expected number is small (under ten). Larger: bao nhiêu."},ex:[["Gia đình bạn có {mấy} người?","가족이 몇 명이에요?","How many in your family?"],["Uống ngày {mấy} lần?","하루에 몇 번 먹어요?","How many times a day?"],["Bạn có {mấy} anh chị em?","형제자매가 몇 명이에요?","How many siblings do you have?"]],d:["bao lâu","gì","đâu"]},
{id:"hay_la",lv:3,g:"Hay là …?",m:{ko:"아니면 ~할까요? (대안 제안)",en:"How about … instead?"},f:{ko:"다른 방법을 제안할 때 문장 앞에.",en:"At the start, to suggest an alternative."},ex:[["{Hay là} chủ nhật nhé?","아니면 일요일 어때?","How about Sunday instead?"],["{Hay là} mình gọi Grab?","아니면 그랩 부를까?","Or shall we call a Grab?"],["{Hay là} để tuần sau?","아니면 다음 주로 할까?","Or how about next week?"]],d:["Nếu","Vì","Còn"]},
{id:"nghe_noi",lv:3,g:"Nghe nói …",m:{ko:"~라고 들었어요, ~래요",en:"I heard that …"},f:{ko:"들은 정보를 전할 때 문장 앞에.",en:"At the start, to pass on something you heard."},ex:[["{Nghe nói} phim này hay lắm.","이 영화 재밌대요.","I hear this movie is great."],["{Nghe nói} chị ấy sắp cưới.","그녀가 곧 결혼한대요.","I heard she's getting married soon."],["{Nghe nói} mai trời mưa.","내일 비 온대요.","I heard it'll rain tomorrow."]],d:["Hay là","Nếu","Cho tôi"]},
{id:"duoc_ability",lv:3,g:"동사 + được",m:{ko:"~할 수 있다 (능력)",en:"can (ability)"},f:{ko:"동사 뒤에 được. 부정: không + 동사 + được.",en:"verb + được. Negative: không + verb + được."},ex:[["Tôi không uống {được} nhiều.","저는 많이 못 마셔요.","I can't drink much."],["Anh ăn rau mùi {được} không?","고수 먹을 수 있어요?","Can you eat coriander?"],["Em nói tiếng Hàn {được}.","저는 한국어를 할 줄 알아요.","I can speak Korean."]],d:["bị","rồi","phải"]},
{id:"moi",lv:3,g:"mời",m:{ko:"~하세요 (권유), 대접하다",en:"invite / please (offer) / treat"},f:{ko:"Mời + 사람 + 동사: 권할 때. 'Tôi mời' = 제가 살게요.",en:"Mời + person + verb to offer. 'Tôi mời' = it's my treat."},ex:[["{Mời} anh vào.","들어오세요.","Please come in."],["Hôm nay tôi {mời}.","오늘은 제가 살게요.","It's on me today."],["{Mời} cả nhà ăn cơm.","다들 식사하세요.","Please, everyone, eat."]],d:["cho","được","nhờ"]},
{id:"truoc_sau",lv:3,g:"trước / sau",m:{ko:"~전 / ~후",en:"before / after / ago / later"},f:{ko:"시간 표현 뒤에 trước (전) / sau (후): mười phút trước = 10분 전.",en:"Time + trước (ago) / sau (later): mười phút trước = ten minutes ago."},ex:[["Khoảng mười phút {trước}.","10분쯤 전에요.","About ten minutes ago."],["Nộp {trước} thứ sáu.","금요일 전에 제출하세요.","Submit before Friday."],["Một tuần {sau}, tôi về Hàn.","일주일 후에 한국에 돌아가요.","A week later, I go back to Korea."]],d:["từ","đến","khi"]},
{id:"con",lv:3,g:"còn",m:{ko:"아직 ~하다, 남아 있다 / 그리고 ~는?",en:"still / remaining / and what about"},f:{ko:"còn + 동사: 아직 ~하다. 문장 앞 còn: 그리고 ~는요?",en:"còn + verb: still. Sentence-initial còn: and what about…?"},ex:[["Phần số liệu {còn} thiếu.","데이터가 아직 부족해요.","The data is still lacking."],["{Còn} anh thì sao?","당신은요?","And you?"],["Phòng {còn} trống không?","빈 방 아직 있어요?","Are there rooms still available?"]],d:["cũng","đã","sẽ"]},
{id:"ma",lv:3,g:"mà",m:{ko:"~인데 (반전), ~한데도",en:"but / yet (contrast)"},f:{ko:"예상과 다른 내용을 이어요. 문장 끝 mà는 '~잖아요'.",en:"Joins contrasting ideas. Sentence-final mà means 'you know' / 'after all'."},ex:[["Máy kêu to {mà} không lạnh.","소리는 큰데 시원하지 않아요.","It's loud but not cold."],["Tôi đang học {mà}.","저 아직 배우는 중이잖아요.","I'm still learning, you know."],["Đắt {mà} không ngon.","비싼데 맛없어요.","Expensive yet not tasty."]],d:["và","nên","thì"]},
{id:"da_cam_on",lv:3,g:"Cảm ơn … đã …",m:{ko:"~해 줘서 고마워요",en:"Thank you for (doing) …"},f:{ko:"Cảm ơn + 사람 + đã + 동사.",en:"Cảm ơn + person + đã + verb."},ex:[["Cảm ơn em {đã} giúp anh.","도와줘서 고마워요.","Thanks for helping me."],["Cảm ơn anh {đã} đến.","와 줘서 고마워요.","Thanks for coming."],["Cảm ơn chị {đã} chờ.","기다려 줘서 고마워요.","Thank you for waiting."]],d:["sẽ","đang","phải"]},
{id:"chuc",lv:3,g:"Chúc …",m:{ko:"~하길 바라요 (기원)",en:"Wishing you …"},f:{ko:"Chúc + 사람 + 바라는 일. 생일·새해·식사 전에도 써요.",en:"Chúc + person + wish. For birthdays, New Year, even before meals."},ex:[["{Chúc} mừng năm mới!","새해 복 많이 받으세요!","Happy New Year!"],["{Chúc} anh ngủ ngon.","잘 자요.","Good night."],["{Chúc} chị sinh nhật vui vẻ!","생일 축하해요!","Happy birthday!"]],d:["Cho","Mời","Nhờ"]},
{id:"giong",lv:3,g:"giống …",m:{ko:"~와 비슷하다, 닮다",en:"similar to / like"},f:{ko:"A giống B = A는 B와 비슷해요. 다르다는 khác.",en:"A giống B = A is like B. Different = khác."},ex:[["{Giống} Việt Nam ăn bánh chưng nhỉ!","베트남에서 바잉쯩 먹는 거랑 비슷하네요!","Like eating bánh chưng in Vietnam!"],["Em {giống} mẹ lắm.","너 엄마를 많이 닮았다.","You look a lot like your mom."],["Tiếng Việt có nhiều từ {giống} tiếng Hàn.","베트남어에는 한국어와 비슷한 단어가 많아요.","Vietnamese has many words similar to Korean."]],d:["khác","hơn","nhất"]},
{id:"nen",lv:3,g:"nên + 동사",m:{ko:"~하는 게 좋다 (조언)",en:"should"},f:{ko:"조언할 때 동사 앞에. 부정: không nên.",en:"Advice, before the verb. Negative: không nên."},ex:[["Anh {nên} liên hệ Đại sứ quán.","대사관에 연락하는 게 좋아요.","You should contact the embassy."],["Em {nên} đi tháng mười.","10월에 가는 게 좋아.","You should go in October."],["Không {nên} uống nước máy.","수돗물은 안 마시는 게 좋아요.","You shouldn't drink tap water."]],d:["bị","được","đã"]},
{id:"cua",lv:2,g:"… của …",m:{ko:"~의 (소유)",en:"of / 's (possession)"},f:{ko:"소유물 + của + 주인. 친한 관계에서는 của를 생략하기도 해요 (bạn tôi).",en:"thing + của + owner. Often dropped for close relations (bạn tôi = my friend)."},ex:[["Đây là bàn làm việc {của} anh.","여기가 당신 자리예요.","This is your desk."],["Số điện thoại {của} bạn là gì?","당신 전화번호가 뭐예요?","What's your phone number?"],["Tiếng Việt {của} bạn giỏi quá!","베트남어 정말 잘하네요!","Your Vietnamese is great!"]],d:["cho","với","ở"]},
{id:"loai_tu",lv:2,g:"cái · con · chiếc · ly · tô",m:{ko:"단위 명사 (분류사)",en:"Classifiers"},f:{ko:"숫자 + 분류사 + 명사. cái(물건), con(동물), ly(잔), tô(그릇), chai(병), người(사람).",en:"number + classifier + noun. cái (things), con (animals), ly (glass), tô (bowl), chai (bottle), người (people)."},ex:[["Cho tôi một {ly} cà phê.","커피 한 잔 주세요.","A cup of coffee, please."],["Hai {tô} phở bò.","소고기 쌀국수 두 그릇.","Two bowls of beef pho."],["Tôi có một {con} mèo.","고양이 한 마리 있어요.","I have a cat."]],d:["người","cái","chai"]},
{id:"vi_nen",lv:3,g:"Vì … nên …",m:{ko:"~이기 때문에 …",en:"Because … so …"},f:{ko:"이유 앞에 vì, 결과 앞에 nên.",en:"vì before the reason, nên before the result."},ex:[["{Vì} trời mưa nên tôi đến muộn.","비가 와서 늦었어요.","Because it rained, I was late."],["{Vì} bận nên tôi không đi được.","바빠서 못 가요.","I'm busy, so I can't go."],["{Vì} ngon nên ăn nhiều.","맛있어서 많이 먹었어요.","It was tasty, so I ate a lot."]],d:["Nếu","Để","Hay là"]},
{id:"dung",lv:3,g:"Đừng … / Hãy …",m:{ko:"~하지 마세요 / ~하세요",en:"Don't … / Do …"},f:{ko:"금지: Đừng + 동사. 권유: Hãy + 동사 (조금 격식).",en:"Prohibition: Đừng + verb. Encouragement: Hãy + verb (a bit formal)."},ex:[["{Đừng} lo, lần sau sẽ tốt hơn.","걱정 마요, 다음엔 더 잘될 거예요.","Don't worry, next time will be better."],["{Đừng} quên mang áo mưa.","우비 챙기는 거 잊지 마요.","Don't forget your raincoat."],["{Hãy} nói chậm thôi.","천천히 말해 주세요.","Please speak slowly."]],d:["Nên","Phải","Được"]}
];

/* ===== TỪ VỰNG & VĂN HÓA ===== */
const VOCAB=[
{id:"chao",ic:"👋",vi:"Chào hỏi",t:{ko:"인사·기본",en:"Basics"},w:[["xin chào","안녕하세요","hello"],["cảm ơn","고마워요","thank you"],["xin lỗi","죄송해요","sorry"],["vâng / dạ","네","yes (polite)"],["không","아니요","no"],["tạm biệt","안녕히 가세요","goodbye"],["tên","이름","name"],["người","사람","person"],["bạn","친구","friend"],["hiểu","이해하다","understand"],["biết","알다","know"],["nói","말하다","speak"],["học","배우다","study"],["tiếng Việt","베트남어","Vietnamese"],["tiếng Hàn","한국어","Korean"],["rất vui","아주 반갑다","very glad"]]},

const hasTTS="speechSynthesis" in window&&typeof SpeechSynthesisUtterance!=="undefined";

function pickVoice(){if(!hasTTS)return null;const vs=speechSynthesis.getVoices().filter(v=>/^vi/i.test(v.lang));
  vs.sort((a,b)=>(/(natural|online|neural|google|premium|enhanced)/i.test(b.name)?1:0)-(/(natural|online|neural|google|premium|enhanced)/i.test(a.name)?1:0));viVoice=vs[0]||null;return viVoice;}

const ssBusy=()=>hasTTS&&(speechSynthesis.speaking||speechSynthesis.pending);
function speak(text,rate,onend){if(!hasTTS){onend&&onend();return;}
  const tok=++ssTok,busy=ssBusy();if(busy)speechSynthesis.cancel();try{speechSynthesis.resume();}catch(e){}
  const go=retry=>{if(tok!==ssTok)return;const u=new SpeechSynthesisUtterance(String(text).replace(/[{}]/g,""));u.lang="vi-VN";if(viVoice||pickVoice())u.voice=viVoice;u.rate=(rate||S.rate||.85);
    let started=false,done=false;const fin=()=>{if(done)return;done=true;if(tok===ssTok&&onend)onend();};
    u.onstart=()=>{started=true;};u.onend=fin;u.onerror=e=>{const er=e&&e.error;if(er==="interrupted"||er==="canceled")return fin();if(!started&&!retry)setTimeout(()=>go(true),200);else fin();};
    window.__utt=u;speechSynthesis.speak(u);
    setTimeout(()=>{if(tok!==ssTok||started||done)return;speechSynthesis.cancel();if(!retry)setTimeout(()=>go(true),200);else fin();},1800);};
  busy?setTimeout(()=>go(false),150):go(false);}
function stopSpeak(){ssTok++;if(ssBusy())speechSynthesis.cancel();}
function speakSeq(list,els,i=0){if(i>=list.length){els&&els.forEach(e=>e.classList.remove("playing"));return;}els&&els.forEach((e,k)=>e.classList.toggle("playing",k===i));speak(list[i],null,()=>setTimeout(()=>speakSeq(list,els,i+1),350));}

  for(let i=0;i<36;i++){const s=document.createElement("i");s.style.left=Math.random()*100+"%";s.style.background=["#2E7D4F","#F2B33D","#D9443A","#7CC4F0"][i%4];s.style.animationDelay=Math.random()*.4+"s";s.style.transform=`rotate(${Math.random()*360}deg)`;c.appendChild(s);}
  document.body.appendChild(c);setTimeout(()=>c.remove(),2200);}
const ICON_SPK=`<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;

   <div class="bar center"><button class="btn primary big" id="pq">🎯 ${t("practice")}</button></div><div id="pqArea"></div>`;
  wireSay(app());const at=$("#allTones");if(at)at.onclick=()=>speakSeq(["ma","má","mà","mả","mã","mạ"]);

function toneSvg(k){const P={M:"M8 18H72",S:"M8 34L72 6",H:"M8 16L72 36",Q:"M8 14L40 34L72 16",N:"M8 26L36 14M44 22L72 4",D:"M8 22L40 38"}[k];
  return `<svg viewBox="0 0 80 44" width="80" height="44"><path d="M4 4V40H76" fill="none" stroke="var(--line)" stroke-width="2"/><path d="${P}" fill="none" stroke="var(--green)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}
function pronQs(u){const qs=[];
  if(u.kind==="t"){const R=u.rows;shuffle(R).forEach(r=>qs.push({type:"mcq",ask:t("q_listen"),listen:r[2],opts:shuffle(R.map(x=>x[2])),ans:r[2],vi:true}));
    shuffle(R).slice(0,4).forEach(r=>qs.push({type:"mcq",ask:t("q_tone"),prompt:r[1]+"  ("+r[2]+")",pvi:true,opts:shuffle([r[0],...shuffle(R.filter(x=>x!==r).map(x=>x[0])).slice(0,3)]),ans:r[0],vi:true}));}
  else if(u.kind==="x"){const SC=[[{ko:"나보다 몇 살 많은 남자 동료",en:"A male coworker a few years older"},"anh"],[{ko:"나보다 몇 살 많은 여자 동료",en:"A female coworker a few years older"},"chị"],[{ko:"나보다 어린 식당 직원",en:"A restaurant server younger than you"},"em"],[{ko:"엄마뻘 되는 집주인 아주머니",en:"A landlady your mother's age"},"cô"],[{ko:"아빠뻘 되는 경비 아저씨",en:"A security guard your father's age"},"chú"],[{ko:"할머니뻘 되는 시장 상인",en:"A grandmother-aged market vendor"},"bà"],[{ko:"비슷한 나이의 새 친구",en:"A new friend about your age"},"bạn"]];
    shuffle(SC).forEach(([s,a])=>qs.push({type:"mcq",ask:t("q_pron"),prompt:L(s),opts:shuffle([a,...shuffle(["anh","chị","em","cô","chú","bà","bạn","ông"].filter(x=>x!==a)).slice(0,3)]),ans:a,vi:true}));}
  else{const R=u.rows.filter(r=>r[2]&&r[3]);shuffle(R).slice(0,8).forEach((r,i)=>{if(i%2===0)qs.push({type:"mcq",ask:t("q_listen"),listen:r[2],opts:shuffle([r[2],...shuffle(R.filter(x=>x!==r).map(x=>x[2])).slice(0,3)]),ans:r[2],vi:true});
    else qs.push({type:"mcq",ask:t("q_mean"),prompt:r[2],pvi:true,say:r[2],opts:shuffle([tx(r[3],r[4]),...shuffle(R.filter(x=>x!==r).map(x=>tx(x[3],x[4]))).slice(0,3)]),ans:tx(r[3],r[4])});});}
  return qs.slice(0,10);}

   <div class="tabs" role="tablist">${[["p","1 · "+t("phrases")],["d","2 · "+t("dialog")],["q","3 · "+t("practice")]].map(([k,n])=>`<button role="tab" data-tab="${k}" aria-selected="${tab===k}">${n}</button>`).join("")}</div><div id="tabBody"></div>`;

     <p class="note whoinfo">A = ${esc(L(l.who.A))} · B = ${esc(L(l.who.B))}</p>
     <div class="chat">${l.dl.map((d,k)=>`<div class="msg ${d[0]==="B"?"me":"you"}"><span class="av">${d[0]==="B"?bao("happy",34):"🇻🇳"}</span><button class="bub ${rp&&d[0]==="B"?"hid":""}" data-k="${k}"><b class="vi">${esc(d[1])}</b>${S.trans?`<small class="tr">${esc(tx(d[2],d[3]))}</small>`:""}</button></div>`).join("")}</div>
     ${gramChips(l)}<div class="bar center"><button class="btn primary" data-tab2="q">${t("practice")} →</button></div>`;
    $("#playAll").onclick=()=>speakSeq(l.dl.map(d=>d[1]),$$(".chat .bub"));
    $("#rp").onchange=e=>{view.rp=e.target.checked;talkLesson(id,"d");};
    $$(".chat .bub").forEach(b=>b.onclick=()=>{b.classList.remove("hid");speak(l.dl[+b.dataset.k][1]);});}
  else{runQuiz(box,talkQs(l),{key:"t:"+l.id,title:l.vi,after:()=>{const n=TALK[idx+1];return n?{label:`${t("next")}: ${n.vi}`,fn:()=>talkLesson(n.id)}:null;}});}
  $$("[data-tab2]").forEach(b=>b.onclick=()=>talkLesson(id,b.dataset.tab2));
  $$("[data-g]").forEach(b=>b.onclick=()=>gramPoint(b.dataset.g));wireSay(box);
  if(tab==="p")l.ph.forEach(p=>{const k="p:"+p[0];if(!S.srs[k]){S.srs[k]=[1,Date.now()+864e5];}});save();}
function gramChips(l){return `<div class="gchips"><b>🧩 ${t("gram_in")}</b><div>${l.g.map(id=>{const g=GRAM.find(x=>x.id===id);return g?`<button class="chip" data-g="${g.id}"><span class="vi">${esc(g.g)}</span> · ${esc(L(g.m))}</button>`:"";}).join("")}</div></div>`;}
function talkQs(l){const qs=[];const P=l.ph,ALLP=TALK.flatMap(x=>x.ph);
  const dis=(arr,ans,f)=>shuffle(arr.filter(x=>f(x)!==f(ans))).slice(0,3).map(f);
  shuffle(P).slice(0,2).forEach(p=>qs.push({type:"mcq",ask:t("q_mean"),prompt:p[0],pvi:true,say:p[0],opts:shuffle([tr3(p),...dis(ALLP,p,tr3)]),ans:tr3(p)}));
  shuffle(P).slice(0,2).forEach(p=>qs.push({type:"mcq",ask:t("q_vi"),prompt:tr3(p),opts:shuffle([p[0],...dis(ALLP,p,x=>x[0])]),ans:p[0],vi:true}));
  const lp=rnd(P);qs.push({type:"mcq",ask:t("q_listen"),listen:lp[0],opts:shuffle([lp[0],...dis(ALLP,lp,x=>x[0])]),ans:lp[0],vi:true});
  const cand=l.dl.filter(d=>d[1].split(" ").length>=3&&d[1].split(" ").length<=9);const od=rnd(cand.length?cand:l.dl);qs.push({type:"order",ask:t("q_order"),prompt:tx(od[2],od[3]),ans:od[1]});
  const pairs=l.dl.map((d,i)=>[d,l.dl[i+1]]).filter(([a,b])=>b&&a[0]==="A"&&b[0]==="B");if(pairs.length){const [a,b]=rnd(pairs);const others=TALK.flatMap(x=>x.dl.filter(d=>d[0]==="B")).filter(d=>d[1]!==b[1]);
    qs.push({type:"mcq",ask:t("q_reply"),pre:t("reply_to"),prompt:a[1],pvi:true,say:a[1],opts:shuffle([b[1],...shuffle(others).slice(0,2).map(d=>d[1])]),ans:b[1],vi:true});}
  const g=GRAM.find(x=>x.id===rnd(l.g));if(g){const e=rnd(g.ex);qs.push(fillQ(g,e));}
  return qs;}
function fillQ(g,e){const m=e[0].match(/\{([^}]+)\}/);const ans=m[1];const opts=shuffle([ans,...shuffle(g.d.filter(x=>x.toLowerCase()!==ans.toLowerCase())).slice(0,3)]);
  return {type:"mcq",ask:t("q_fill"),prompt:e[0].replace(/\{[^}]+\}/,"____"),pvi:true,sub:tx(e[1],e[2]),opts,ans,vi:true,after:bare(e[0])};}

/* ===================== MÁY CHẠY BÀI LUYỆN ===================== */
function runQuiz(box,qs,o){o=o||{};let i=0,score=0;const wrongs=[];
  const show=()=>{if(i>=qs.length)return finish();const q=qs[i];stopSpeak();
    const head=`<div class="qhead"><span>${i+1} / ${qs.length}</span><div class="qbar"><i style="width:${i/qs.length*100}%"></i></div><span>✓ ${score}</span></div>`;
    let body;
    if(q.type==="order"){const words=shuffle(q.ans.replace(/[.?!,…]/g," ").split(/\s+/).filter(Boolean));q._w=words;
      body=`<p class="qask">${q.ask}</p><p class="qprompt">${esc(q.prompt)}</p><div class="oslot" id="oslot"><span class="ph">${t("empty_ans")}</span></div><div class="obank">${words.map((w,k)=>`<button class="ow vi" data-k="${k}">${esc(w)}</button>`).join("")}</div>
        <div class="bar"><button class="btn" id="oreset">${t("reset_order")}</button><button class="btn primary" id="ocheck">${t("check")}</button></div>`;}
    else body=`<p class="qask">${q.ask}</p>${q.pre?`<p class="note">${q.pre}</p>`:""}
      ${q.listen?`<div class="bar"><button class="spk big" id="qplay" aria-label="${t("listen")}">${ICON_SPK}</button><button class="btn sm" id="qslow">🐢 ${t("slow")}</button></div>`:
        `<p class="qprompt ${q.pvi?"vi":""}">${esc(q.prompt)} ${q.say?spk(q.say):""}</p>`}${q.sub?`<p class="note">${esc(q.sub)}</p>`:""}
      <div class="opts">${q.opts.map((x,k)=>`<button class="opt ${q.vi?"vi":""}" data-k="${k}">${esc(x)}</button>`).join("")}</div>`;
    box.innerHTML=`<div class="quiz card">${head}${body}<div id="qfb"></div></div>`;wireSay(box);
    if(q.listen){const pl=()=>speak(q.listen);$("#qplay").onclick=pl;$("#qslow").onclick=()=>speak(q.listen,.55);setTimeout(pl,250);}
    if(q.type==="order"){const picked=[];const slot=$("#oslot");const draw=()=>{slot.innerHTML=picked.length?picked.map((k,j)=>`<button class="ow vi on" data-j="${j}">${esc(q._w[k])}</button>`).join(""):`<span class="ph">${t("empty_ans")}</span>`;
        slot.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{picked.splice(+b.dataset.j,1);box.querySelectorAll(".obank .ow").forEach(x=>x.disabled=picked.includes(+x.dataset.k));draw();});};
      box.querySelectorAll(".obank .ow").forEach(b=>b.onclick=()=>{picked.push(+b.dataset.k);b.disabled=true;sfx("tap");draw();});
      $("#oreset").onclick=()=>{picked.length=0;box.querySelectorAll(".obank .ow").forEach(x=>x.disabled=false);draw();};
      $("#ocheck").onclick=()=>{if(!picked.length)return;const got=picked.map(k=>q._w[k]).join(" ");const ok=norm(got)===norm(q.ans);judge(ok,q.ans);};}
    else box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const ok=q.opts[+b.dataset.k]===q.ans;box.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(q.opts[+x.dataset.k]===q.ans)x.classList.add("right");});if(!ok)b.classList.add("wrong");judge(ok,q.ans);});};
  const judge=(ok,ans)=>{const q=qs[i];if(ok)score++;else wrongs.push(q);sfx(ok?"ok":"no");box.querySelectorAll("#ocheck,#oreset,.ow").forEach(x=>x.disabled=true);
    const sayIt=q.after||(q.vi||q.type==="order"?ans:q.say||null);if(sayIt)speak(sayIt);

  $("#uiTog").textContent=S.ui==="ko"?"EN":"한";$("#uiTog").setAttribute("aria-label",S.ui==="ko"?"Switch to English":"한국어로 보기");$("#foot").textContent=t("footer");document.documentElement.lang=S.ui;sideSync();}

function rerender(){if(view.reFn)return view.reFn();const n=view.name;({home,learn,speak:speakHome,games:gamesHome,me,review,culture,gram:gramHome,vocab:vocabHome}[n]||home)();}
